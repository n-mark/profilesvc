services:
  postgres:
    image: postgres:18.3
    container_name: hl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: social_user
      POSTGRES_PASSWORD: social_pass
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_user -d social"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shared-network



  profile:
    build: .
    container_name: profile
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: social
      DB_USER: social_user
      DB_PASSWORD: social_pass
      SERVER_ADDR: :8080
      # RABBITMQ | KAFKA — переключение реализации брокера
      BROKER_TYPE: ${BROKER_TYPE:-KAFKA}

      # --- Kafka (общий кластер в shared-network, поднимается из advert-cmd-svc) ---
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
      KAFKA_PROFILE_TOPIC: "profile"
      KAFKA_BILLING_TOPIC: "billing"
      KAFKA_BILLING_GROUP: "profilesvc.billing"
      KAFKA_PROFILE_CREATED_EVENT_TYPE: "profile.created"
      KAFKA_BILLING_ACCOUNT_CREATED_EVENT_TYPE: "billing.account.created"

      # --- RabbitMQ (legacy, используется при BROKER_TYPE=RABBITMQ) ---
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: ${RABBIT_PORT:-5672}
      RABBIT_USERNAME: ${RABBIT_USERNAME:-billing}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-billing}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared-network

volumes:
  pgdata:

networks:
  shared-network:
    external: true
    name: shared-network