services:
  postgres:
    image: postgres:18.3
    container_name: hl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: social_user
      POSTGRES_PASSWORD: social_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_user -d social"]
      interval: 5s
      timeout: 5s
      retries: 10



  profile:
    build: .
    container_name: profile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: social
      DB_USER: social_user
      DB_PASSWORD: social_pass
      SERVER_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: